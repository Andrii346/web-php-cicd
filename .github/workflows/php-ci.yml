name: PHP CI Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --prefer-dist

      - name: Lint code with Pint
        run: ./vendor/bin/pint --test

      - name: Run unit tests
        run: ./vendor/bin/phpunit tests/Unit

      - name: Demonstrate GitHub Secrets
        run: |
          echo "Демонстрація маскування секретів:"
          echo "Secret is ${{ secrets.MY_SUPER_SECRET_KEY }}"